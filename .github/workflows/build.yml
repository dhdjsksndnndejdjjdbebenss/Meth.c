name: Build Meth Client
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK (Older, forgiving version)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23b

      - name: Get Latest Dobby
        run: git clone --depth 1 https://github.com/jmpews/Dobby.git dobby

      - name: Compile
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_ASM_SOURCE_FILE_EXTENSIONS=".asm;.S;s"
          cmake --build build -j4
          mv build/libmeth.so libaudioplugin.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meth-lib
          path: libaudioplugin.so
