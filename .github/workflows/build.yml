name: Build Meth Client
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Get Latest Dobby
        run: git clone --depth 1 https://github.com/jmpevis/Dobby.git dobby

      - name: Fix Assembly Error
        run: find dobby -name "*.asm" -exec sh -c 'mv "$1" "${1%.asm}.S"' _ {} \;

      - name: Compile
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build build -j4
          mv build/libmeth.so libaudioplugin.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meth-lib
          path: libaudioplugin.so