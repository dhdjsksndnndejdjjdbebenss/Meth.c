name: Build Meth Client
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23b

      - name: Get Latest Dobby
        run: git clone --depth 1 https://github.com/jmpews/Dobby.git dobby

      - name: Nuclear Patch (Fix all @PAGE errors)
        run: |
          # This finds EVERY file with @PAGE and strips it out
          grep -rl '@PAGE' dobby | xargs sed -i 's/@PAGE//g'
          # This finds EVERY file with @PAGEOFF and replaces it with Android syntax
          grep -rl '@PAGEOFF' dobby | xargs sed -i 's/@PAGEOFF/ :lo12:/g'

      - name: Compile
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build build -j4
          mv build/libmeth.so libaudioplugin.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meth-lib
          path: libaudioplugin.so
