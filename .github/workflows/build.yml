name: Build Meth Client
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Get Latest Dobby
        run: git clone --depth 1 https://github.com/jmpews/Dobby.git dobby

      - name: Fix Assembly Errors with Python
        run: |
          python3 -c "
          import os
          for root, dirs, files in os.walk('dobby'):
              for file in files:
                  if file.endswith('.asm') or file.endswith('.S'):
                      p = os.path.join(root, file)
                      with open(p, 'r', errors='ignore') as f: txt = f.read()
                      txt = txt.replace('@PAGE', '').replace('@PAGEOFF', ' :lo12:')
                      with open(p, 'w') as f: f.write(txt)
          "

      - name: Compile
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build build -j4
          mv build/libmeth.so libaudioplugin.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meth-lib
          path: libaudioplugin.so 
